# 多环境配置（示例值，接入真实系统时替换为自己的环境地址）
# login_url 支持 fixture:// 前缀加载本地 HTML，用于框架自验证
defaults:
  timeout: 30000
  headless: true
  slow_mo: 0
  browser: chromium
  # channel: 使用系统浏览器（chrome / msedge），留空则用 Playwright 内置浏览器。
  # 内置浏览器需先运行 playwright install chromium 下载。
  channel: chrome

environments:
  # 本地 HTML fixture，用于框架自验证（开箱即跑通，不依赖外部系统）
  local:
    base_url: ""
    login_url: fixture://login.html
    timeout: 15000
    headless: true

  dev:
    base_url: https://dev.example.com
    login_url: https://dev.example.com/web/
    timeout: 60000
    headless: true

  sit:
    base_url: https://sit.example.com
    login_url: https://sit.example.com/web/
    timeout: 60000
    headless: true

  uat:
    base_url: https://uat.example.com
    login_url: https://uat.example.com/web/
    timeout: 60000
    headless: true

  prod:
    base_url: https://prod.example.com
    login_url: https://prod.example.com/web/
    timeout: 60000
    headless: true
