<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>示例页面 - 框架自检</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    .card { background: #fff; padding: 40px; border-radius: 8px; width: 360px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .title { text-align: center; font-size: 20px; margin-bottom: 24px; color: #262626; font-weight: 600; }
    .form-item { margin-bottom: 16px; }
    input { width: 100%; height: 40px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 12px; font-size: 14px; }
    input:focus { border-color: #40a9ff; outline: none; box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
    .btn { width: 100%; height: 40px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 8px; }
    .btn:hover { background: #40a9ff; }
    .msg { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; }
    .msg.success { color: #52c41a; }
    .msg.error { color: #ff4d4f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">示例页面</div>
    <div class="form-item">
      <input id="keyword" type="text" placeholder="请输入关键字" />
    </div>
    <button class="btn" onclick="doSearch()">查 询</button>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    function doSearch() {
      var kw = document.getElementById('keyword').value;
      if (!kw) {
        showMsg('请输入关键字', 'error');
        return;
      }
      showMsg('查询成功', 'success');
    }
    function showMsg(text, type) {
      var el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }
  </script>
</body>
</html>
