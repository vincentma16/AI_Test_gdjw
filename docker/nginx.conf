server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;
    autoindex    on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 每次运行的报告放在 runs/<日期>/<序号>/report/ 下。
    # Allure 是单页应用，报告目录内找不到的静态资源回落到该报告的 index.html。
    # 注意：正则必须加引号，否则 nginx 会把 {4} 当成配置块的起始花括号
    location ~ "^/([0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{3})/report/(.*)$" {
        try_files $uri /$1/report/index.html =404;
    }

    # 其余路径（含 index.html 导航页与自动索引）
    location / {
        try_files $uri $uri/ =404;
    }
}
