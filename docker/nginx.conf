server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Allure 单页应用依赖前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
