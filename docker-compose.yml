# AI 测试工作台 —— 一键运行入口
#
# 用法：
#   bash docker/run-tests.sh --suite api                  # 推荐入口：自动分配序号 + 并发隔离
#   bash docker/run-tests.sh --suite ui --env sit
#   bash docker/run-report.sh --seq 001                   # 为该次运行出报告
#   docker compose --profile report up -d report-site     # 报告站 http://127.0.0.1:8080
#   docker compose down -v                                # 清理
#
# 注意：报告必须带上服务名 report-site。直接 `up -d` 会把测试服务一起拉起来跑一遍，
# 因为 profile 只是"额外启用"，不会限制已存在的服务。
#
# 资产边界：
#   工程目录（api-automation / ui-automation）  -> /app          读写，随 git 走
#   projects/ templates/ schemas/ config/      -> /assets/**    只读，容器只消费不改写
#   runs/                                      -> /runs         归档产物，不进 git
#
# 项目名称可被 COMPOSE_PROJECT_NAME 覆盖：并发运行时各自独立，容器名不会打架
# （docker/run-tests.sh 已自动处理，一般情况下不必自己设）
name: ${COMPOSE_PROJECT_NAME:-ai-test-workbench}

services:
  # ------------------------------------------------------------------
  # 接口自动化
  # ------------------------------------------------------------------
  api-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        BUILD_PROXY: ${BUILD_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ai-test/api-tests:latest
    working_dir: /app
    env_file:
      - path: docker/compose.env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      SUITE: api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 工程源码：读写挂载，改代码不用重建镜像
      - ./api-automation:/app
      # 归档目录
      - ./runs:/runs
      # 创作层资产：只读挂载，容器不能改写需求 / 评审 / 用例
      - ./projects:/assets/projects:ro
      - ./templates:/assets/templates:ro
      - ./schemas:/assets/schemas:ro
      - ./config:/assets/config:ro
    command: ["--env=dev"]

  # ------------------------------------------------------------------
  # UI 自动化
  # ------------------------------------------------------------------
  ui-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
      args:
        BUILD_PROXY: ${BUILD_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ai-test/ui-tests:latest
    working_dir: /app
    env_file:
      - path: docker/compose.env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      SUITE: ui
      # 登录态写到容器 /tmp，随容器销毁，不落宿主机
      AUTH_STATE_FILE: /tmp/.auth_state.json
      # 容器里没有系统 Chrome，置空改用 Playwright 内置 chromium
      BROWSER_CHANNEL: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ui-automation:/app
      - ./runs:/runs
      - ./projects:/assets/projects:ro
      - ./templates:/assets/templates:ro
      - ./schemas:/assets/schemas:ro
      - ./config:/assets/config:ro
    # 默认 local：跑本地 HTML fixture，不联网，可用来验证容器本身是否可用
    command: ["--env=local"]

  # ------------------------------------------------------------------
  # 报告（report profile，默认不参与 up，避免每次都拉起）
  # ------------------------------------------------------------------
  # 报告按「一次运行」独立生成到 runs/<日期>/<序号>/report/，不再互相覆盖。
  # 默认取 runs/ 下最新一次运行，可用 RUN_DIR=/runs/<日期>/<序号> 指定某一次。
  allure-generate:
    profiles: ["report"]
    build:
      context: .
      dockerfile: docker/Dockerfile.allure
      args:
        BUILD_PROXY: ${BUILD_PROXY:-}
    image: ai-test/allure:latest
    restart: "no"
    environment:
      # 留空 = 自动定位最新一次运行
      RUN_DIR: ""
    volumes:
      # 读写：报告要写回该次运行的目录下
      - ./runs:/runs

  # 报告站：托管 runs/ 下的所有归档（每次运行的报告各占一个路径）
  # 只绑 127.0.0.1 —— 后续接可视化平台时由平台鉴权后转发，不要把这里直接暴露到局域网
  report-site:
    profiles: ["report"]
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./runs:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      allure-generate:
        condition: service_completed_successfully
