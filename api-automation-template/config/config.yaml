# 多环境配置（模板占位，接入新项目时替换 TODO）
# home/base_url 为被测系统主域名；业务服务域名见 services
# 覆盖规则：.env 里的 <ENV>_BASE_URL 优先级最高，其次是这里的配置
defaults:
  timeout: 15
  retry: 0

environments:
  sit:
    base_url: https://TODO-sit.example.com
    timeout: 15
    services:
      # TODO: 服务名与域名，供 apis 层 service_url("服务名") 使用
      example-service: https://TODO-sit.example.com/example-service
  prod:
    base_url: https://TODO.example.com
    timeout: 10
    services:
      example-service: https://TODO.example.com/example-service

# 鉴权配置：common/auth.py 按此执行（login -> apply_auth），不硬编码
auth:
  login_endpoint: /TODO/login                 # TODO: 登录接口路径
  token_jsonpath: "$.result.access_token"     # TODO: token 提取路径
  credentials:
    # TODO: 登录凭证字段名与值；敏感账号用 ${VAR} 占位，真实值放 .env
    username: "${TEST_USERNAME}"
    password: "${TEST_PASSWORD}"
  # 注入方式二选一或都用
  header:
    name: Authorization
    prefix: "Bearer "
  query_param:
    name: accessToken

# 更复杂的鉴权（多头、签名、岗位/租户头等）在此基础上扩展：
# 在 auth 段加自己的配置，再写对应的 apply_xxx 函数即可，不要在 auth.py 里写死结构。
